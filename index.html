    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mandelbrot Explorer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="controls">
            <label for="iterations">Iterations:</label>
            <!-- Removed max attribute -->
            <input type="number" id="iterations" value="100" min="10" step="10">

            <div class="zoom-control">
                <label for="zoomSlider">Zoom:</label>
                <input type="range" id="zoomSlider" min="0" max="20" step="0.1" value="0">
                <input type="number" id="zoomInput" min="0" max="20" step="0.1" value="0">
            </div>

            <button id="reset">Reset View</button>
            <p>Click/drag to pan. Scroll/Slider to zoom.</p>
            <div id="loading" style="display: none;">Calculating...</div>
        </div>
        <canvas id="mandelbrotCanvas"></canvas>
        <script type="module" src="main.js"></script>
    </body>
    </html>
